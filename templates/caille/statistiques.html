{% extends "base.html" %}
{% block title %}Statistiques{% endblock %}
{% block page_title %}Statistiques{% endblock %}

{% block content %}
<form class="row g-2 mb-3 align-items-end" id="formFiltre">
  <div class="col-auto"><label class="form-label mb-0">Du</label><input type="date" class="form-control form-control-sm" id="fDebut" value="{{ date_debut }}"></div>
  <div class="col-auto"><label class="form-label mb-0">Au</label><input type="date" class="form-control form-control-sm" id="fFin" value="{{ date_fin }}"></div>
  <div class="col-auto">
    <label class="form-label mb-0">Lot</label>
    <select class="form-select form-select-sm" id="fLot">
      <option value="">Tous les lots</option>
      {% for l in lots %}<option value="{{ l.id }}">{{ l.nom }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-auto"><button type="button" class="btn btn-sm btn-outline-secondary" onclick="chargerGraphiques()">Actualiser</button></div>
</form>

<div class="card mb-3">
  <div class="card-header"><i class="bi bi-egg"></i> Ponte — œufs pondus vs vendus</div>
  <div class="card-body"><canvas id="chartPonte" height="90"></canvas></div>
</div>

<div class="card">
  <div class="card-header"><i class="bi bi-exclamation-triangle"></i> Mortalité — cailles vs cailletons</div>
  <div class="card-body"><canvas id="chartMortalite" height="90"></canvas></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
let chartPonte, chartMortalite;

async function chargerGraphiques() {
  const debut = document.getElementById('fDebut').value;
  const fin = document.getElementById('fFin').value;
  const lotId = document.getElementById('fLot').value;
  const qs = `debut=${debut}&fin=${fin}${lotId ? '&lot_id=' + lotId : ''}`;

  const [ponteRes, mortRes] = await Promise.all([
    fetch(`{{ url_for('caille.api_stats_ponte') }}?${qs}`),
    fetch(`{{ url_for('caille.api_stats_mortalite') }}?${qs}`),
  ]);
  const ponte = await ponteRes.json();
  const mort = await mortRes.json();

  const ctxPonte = document.getElementById('chartPonte');
  if (chartPonte) chartPonte.destroy();
  chartPonte = new Chart(ctxPonte, {
    type: 'line',
    data: {
      labels: ponte.labels,
      datasets: [
        { label: 'Pondus', data: ponte.pondus, borderColor: '#8a5a2b', backgroundColor: 'rgba(138,90,43,.15)', tension: .3, fill: true },
        { label: 'Vendus', data: ponte.vendus, borderColor: '#198754', backgroundColor: 'rgba(25,135,84,.1)', tension: .3, fill: true },
      ]
    },
    options: { responsive: true, interaction: { mode: 'index', intersect: false } }
  });

  const ctxMort = document.getElementById('chartMortalite');
  if (chartMortalite) chartMortalite.destroy();
  chartMortalite = new Chart(ctxMort, {
    type: 'bar',
    data: {
      labels: mort.labels,
      datasets: [
        { label: 'Cailles', data: mort.cailles, backgroundColor: '#dc3545' },
        { label: 'Cailletons', data: mort.cailletons, backgroundColor: '#fd7e14' },
      ]
    },
    options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } } }
  });
}

document.addEventListener('DOMContentLoaded', chargerGraphiques);
</script>
{% endblock %}
