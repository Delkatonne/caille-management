<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — HITNA Caille</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background: var(--caille-bg); }
  .login-card { width: 100%; max-width: 360px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-3">
    <div style="font-size:2rem;"><img src="{{ url_for('static', filename='img/logo-hitna.jpg') }}" alt="logo hitna" ></div>
    <h4 class="mb-0">HITNA <span style="color:var(--caille-accent)">Ferme</span></h4>
    <div class="text-muted small">Gestion de la ferme Hitna</div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Identifiant</label>
          <input class="form-control" name="username" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button class="btn btn-primary w-100">Se connecter</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
